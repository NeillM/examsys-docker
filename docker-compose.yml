version: '2'
services:
  web:
    build: .
    depends_on:
     - db
     - cache
     - calc
    volumes:
     - "${ROGO_DOCKER_WWWROOT}:/var/www"
  db:
   image: mysql:5.7
   environment:
     MYSQL_ROOT_PASSWORD: ${ROGO_DOCKER_MYSQLROOT}
  cache:
   image: memcached:1.5
  calc:
   image: stevenpollack/docker-rserve
  selenium:
   image: selenium/standalone-chrome:3.12.0-cobalt
   volumes:
    - /dev/shm:/dev/shm