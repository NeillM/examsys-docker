version: '2'
services:
  web:
    build: .
    ports:
     - "80:80"
     - "443:443"
     - "8003:8003"
    depends_on:
     - db
     - cache
     - calc
    volumes:
     - "${ROGO_DOCKER_WWWROOT}:/var/www"
  db:
   image: mysql:5.6
   environment:
     MYSQL_ROOT_PASSWORD: ${ROGO_DOCKER_MYSQLROOT}
  cache:
   image: memcached:1.5
  calc:
   image: stevenpollack/docker-rserve
  firefox:
   image: selenium/node-firefox:3.12.0-cobalt
   volumes:
    - /dev/shm:/dev/shm
   depends_on:
    - hub
   environment:
    HUB_HOST: hub
  chrome:
   image: selenium/node-chrome:3.12.0-cobalt
   volumes:
    - /dev/shm:/dev/shm
   depends_on:
    - hub
   environment:
    HUB_HOST: hub
  hub:
   image: selenium/hub:3.12.0-cobalt
   ports:
    - "4444:4444"