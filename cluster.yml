version: '2'
services:
  web:
    networks:
      - frontend
  ndbmgmt:
    image: mysql/mysql-cluster:${EXAMSYS_DOCKER_CLUSTERVERSION}
    command: ndb_mgmd
    networks:
      cluster:
        ipv4_address: 192.168.0.2
    volumes:
      - ./conf/mysql-cluster.cnf:/etc/mysql-cluster.cnf
  ndbnode1:
    image: mysql/mysql-cluster:${EXAMSYS_DOCKER_CLUSTERVERSION}
    command: ndbd
    networks:
      cluster:
        ipv4_address: 192.168.0.3
    depends_on:
      - ndbmgmt
  ndbnode2:
    image: mysql/mysql-cluster:${EXAMSYS_DOCKER_CLUSTERVERSION}
    command: ndbd
    networks:
      cluster:
        ipv4_address: 192.168.0.4
    depends_on:
      - ndbmgmt
  db:
    image: mysql/mysql-cluster:${EXAMSYS_DOCKER_CLUSTERVERSION}
    command: mysqld --default_authentication_plugin=mysql_native_password
    restart: always
    networks:
      frontend:
      cluster:
        ipv4_address: 192.168.0.10
    environment:
      MYSQL_ROOT_PASSWORD: ${EXAMSYS_DOCKER_MYSQLROOT}
      MYSQL_ROOT_HOST: "%"
      TZ: ${EXAMSYS_DOCKER_MYSQLTZ}
    depends_on:
      - ndbmgmt
      - ndbnode1
      - ndbnode2
  cache:
    networks:
      - frontend
  calc:
    networks:
      - frontend
  selenium:
    networks:
      - frontend
networks:
  frontend:
    driver: bridge
  cluster:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.0.0/16
