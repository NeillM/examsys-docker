services:
  mysql-server-1:
    image: mysql/mysql-server:${EXAMSYS_DOCKER_MYSQLVERSION}
    environment:
      MYSQL_ROOT_PASSWORD: "password"
      MYSQL_ROOT_HOST: "%"
      TZ: ${EXAMSYS_DOCKER_MYSQLTZ}
    command: [
      "mysqld",
      "--server_id=1",
      "--binlog_checksum=NONE",
      "--gtid_mode=ON",
      "--enforce_gtid_consistency=ON",
      "--log_bin",
      "--log_slave_updates=ON",
      "--master_info_repository=TABLE",
      "--relay_log_info_repository=TABLE",
      "--transaction_write_set_extraction=XXHASH64",
      "--user=root",
      "--skip-host-cache",
      "--skip-name-resolve"
    ]
  mysql-server-2:
    image: mysql/mysql-server:${EXAMSYS_DOCKER_MYSQLVERSION}
    environment:
      MYSQL_ROOT_PASSWORD: "password"
      MYSQL_ROOT_HOST: "%"
      TZ: ${EXAMSYS_DOCKER_MYSQLTZ}
    command: [
      "mysqld",
      "--server_id=2",
      "--binlog_checksum=NONE",
      "--gtid_mode=ON",
      "--enforce_gtid_consistency=ON",
      "--log_bin",
      "--log_slave_updates=ON",
      "--master_info_repository=TABLE",
      "--relay_log_info_repository=TABLE",
      "--transaction_write_set_extraction=XXHASH64",
      "--user=root",
      "--skip-host-cache",
      "--skip-name-resolve"
    ]
  mysql-server-3:
    image: mysql/mysql-server:${EXAMSYS_DOCKER_MYSQLVERSION}
    environment:
      MYSQL_ROOT_PASSWORD: "password"
      MYSQL_ROOT_HOST: "%"
      TZ: ${EXAMSYS_DOCKER_MYSQLTZ}
    command: [
      "mysqld",
      "--server_id=3",
      "--binlog_checksum=NONE",
      "--gtid_mode=ON",
      "--enforce_gtid_consistency=ON",
      "--log_bin",
      "--log_slave_updates=ON",
      "--master_info_repository=TABLE",
      "--relay_log_info_repository=TABLE",
      "--transaction_write_set_extraction=XXHASH64",
      "--user=root",
      "--skip-host-cache",
      "--skip-name-resolve"
    ]
  mysql-shell:
    image: bkandasa/mysql-shell-batch
    environment:
      MYSQL_USER: ${EXAMSYS_DOCKER_MYSQL_USER}
      MYSQL_PORT: 6446
      MYSQL_HOST: mysql-server-1
      MYSQL_PASSWORD: ${EXAMSYS_DOCKER_MYSQLROOT}
      MYSQLSH_SCRIPT: /scripts/setupCluster.js
    volumes:
      - ./scripts/:/scripts/
    depends_on:
      - mysql-server-1
      - mysql-server-2
      - mysql-server-3
  db:
    image: mysql/mysql-router:${EXAMSYS_DOCKER_MYSQL_ROUTERVERSION}
    environment:
      MYSQL_USER: ${EXAMSYS_DOCKER_MYSQL_USER}
      MYSQL_PORT: 6446
      MYSQL_HOST: "%"
      MYSQL_PASSWORD: ${EXAMSYS_DOCKER_MYSQLROOT}
      MYSQL_INNODB_NUM_MEMBERS: 3
      TZ: ${EXAMSYS_DOCKER_MYSQLTZ}
    depends_on:
      - mysql-server-1
      - mysql-server-2
      - mysql-server-3
      - mysql-shell
    restart: on-failure
